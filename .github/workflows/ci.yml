name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # cuando package-lock.json este en el repositorio, cambiar por: npm ci
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build
