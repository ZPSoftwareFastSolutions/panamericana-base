name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proyecto:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar contrato compartido
        run: npm run build:shared

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
